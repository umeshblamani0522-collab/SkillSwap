server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local
  application:
    name: skill-exchange-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:skillexchange}
    username: ${DB_USERNAME:skillexchange_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  mail:
    mode: ${APP_MAIL_MODE:smtp}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  uploads-dir: ${UPLOADS_DIR:uploads}
  exchange-request:
    expiry-check-ms: ${EXCHANGE_EXPIRY_CHECK_MS:300000}
    expiry-initial-delay-ms: ${EXCHANGE_EXPIRY_INITIAL_DELAY_MS:30000}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  email-verification:
    expiration-minutes: ${EMAIL_VERIFICATION_EXPIRATION_MINUTES:30}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*:5173,http://10.*.*.*:5173,http://172.16.*.*:5173,http://172.17.*.*:5173,http://172.18.*.*:5173,http://172.19.*.*:5173,http://172.20.*.*:5173,http://172.21.*.*:5173,http://172.22.*.*:5173,http://172.23.*.*:5173,http://172.24.*.*:5173,http://172.25.*.*:5173,http://172.26.*.*:5173,http://172.27.*.*:5173,http://172.28.*.*:5173,http://172.29.*.*:5173,http://172.30.*.*:5173,http://172.31.*.*:5173}
  video-room:
    min-match-score: ${VIDEO_ROOM_MIN_MATCH_SCORE:60}
    ttl-minutes: ${VIDEO_ROOM_TTL_MINUTES:30}
    cleanup-ms: ${VIDEO_ROOM_CLEANUP_MS:3600000}
    cleanup-initial-delay-ms: ${VIDEO_ROOM_CLEANUP_INITIAL_DELAY_MS:60000}
  jaas:
    enabled: ${JAAS_ENABLED:false}
    app-id: ${JAAS_APP_ID:}
    api-key-id: ${JAAS_API_KEY_ID:}
    private-key-path: ${JAAS_PRIVATE_KEY_PATH:}
    private-key: ${JAAS_PRIVATE_KEY:}
    jwt-ttl-minutes: ${JAAS_JWT_TTL_MINUTES:15}
    use-staging: ${JAAS_USE_STAGING:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.skillexchange: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
